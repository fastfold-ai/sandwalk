# Build + publish Sandwalk macOS desktop (DMG + Tauri updater artifacts).
#
# Today: ad-hoc Apple codesign (`CODESIGN_IDENTITY=-`) + automated minisign
# updater signing via `TAURI_SIGNING_PRIVATE_KEY` secret.
# Later: set CODESIGN_IDENTITY / Apple secrets and enable the notarize step
# (see apps/packaging/README.md → "Apple Developer ID / notarization").

name: Release Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without leading v (e.g. 0.0.2). Leave blank to use apps/local-web/package.json.'
        type: string
        required: false
      draft:
        description: 'Create a draft GitHub Release (recommended until public).'
        type: boolean
        default: true
      prerelease:
        description: 'Mark the GitHub Release as a pre-release.'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.repository }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    name: macOS arm64 DMG
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          INPUT="${{ inputs.version }}"
          if [[ -n "${INPUT// }" ]]; then
            VERSION="${INPUT#v}"
          else
            VERSION="$(node -p 'require("./apps/local-web/package.json").version')"
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: ${VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version ${VERSION} (tag v${VERSION})"

      - name: Stamp versions
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            for (const p of [
              "apps/local-web/package.json",
              "apps/local-web/src-tauri/tauri.conf.json",
            ]) {
              const j = JSON.parse(fs.readFileSync(p, "utf8"));
              j.version = v;
              fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
            }
            const cargo = "apps/local-web/src-tauri/Cargo.toml";
            let t = fs.readFileSync(cargo, "utf8");
            t = t.replace(/^version = "[^"]+"/m, `version = "${v}"`);
            fs.writeFileSync(cargo, t);
          '
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" \
            apps/sandwalk-mac/Resources/Info.plist 2>/dev/null \
            || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${VERSION}" \
            apps/sandwalk-mac/Resources/Info.plist 2>/dev/null \
            || true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/local-web/src-tauri -> target
          cache-on-failure: true

      - name: Install cmake + uv
        run: |
          brew install cmake
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Package DMG (ad-hoc codesign + updater minisign)
        env:
          # Self-sign Apple binaries for now. Swap for Developer ID later.
          CODESIGN_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.ver.outputs.tag }}/Sandwalk.app.tar.gz
        run: ./apps/packaging/package-macos-dmg.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sandwalk-macos-arm64-${{ steps.ver.outputs.version }}
          path: |
            apps/packaging/dist/Sandwalk-*-macos-arm64.dmg
            apps/packaging/dist/Sandwalk-macos-arm64.dmg
            apps/packaging/dist/Sandwalk.app.tar.gz
            apps/packaging/dist/Sandwalk.app.tar.gz.sig
            apps/packaging/dist/latest.json
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Sandwalk ${{ steps.ver.outputs.tag }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          fail_on_unmatched_files: false
          files: |
            apps/packaging/dist/Sandwalk-${{ steps.ver.outputs.version }}-macos-arm64.dmg
            apps/packaging/dist/Sandwalk-macos-arm64.dmg
            apps/packaging/dist/Sandwalk.app.tar.gz
            apps/packaging/dist/Sandwalk.app.tar.gz.sig
            apps/packaging/dist/latest.json
          body: |
            ## Sandwalk Desktop ${{ steps.ver.outputs.tag }}

            **macOS (Apple Silicon)** — download `Sandwalk-macos-arm64.dmg` (or the versioned DMG).

            ### Notes
            - Codesign: **ad-hoc** (self-signed). Gatekeeper may warn until Apple Developer ID + notarization are enabled.
            - In-app updates use `latest.json` + `Sandwalk.app.tar.gz` (minisign).

            See `apps/packaging/README.md` for Apple notarization when the Developer ID is ready.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
