# Build + publish Sandwalk macOS desktop (DMG + Tauri updater artifacts).
#
# Apple Developer ID + notarization when APPLE_CERTIFICATE is set
# (see apps/packaging/APPLE-SIGNING.md). Falls back to ad-hoc codesign.
# Updater minisign uses TAURI_SIGNING_PRIVATE_KEY.

name: Release Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without leading v (e.g. 0.1.0-beta.1). Leave blank to use apps/local-web/package.json.'
        type: string
        required: false
      draft:
        description: 'Create a draft GitHub Release (recommended until public).'
        type: boolean
        default: true
      prerelease:
        description: 'Mark the GitHub Release as a pre-release.'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.repository }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    name: macOS arm64 DMG
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          INPUT="${{ inputs.version }}"
          if [[ -n "${INPUT// }" ]]; then
            VERSION="${INPUT#v}"
          else
            VERSION="$(node -p 'require("./apps/local-web/package.json").version')"
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: ${VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version ${VERSION} (tag v${VERSION})"

      - name: Stamp versions
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            for (const p of [
              "apps/local-web/package.json",
              "apps/local-web/src-tauri/tauri.conf.json",
            ]) {
              const j = JSON.parse(fs.readFileSync(p, "utf8"));
              j.version = v;
              fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
            }
            const cargo = "apps/local-web/src-tauri/Cargo.toml";
            let t = fs.readFileSync(cargo, "utf8");
            t = t.replace(/^version = "[^"]+"/m, `version = "${v}"`);
            fs.writeFileSync(cargo, t);
          '
          # Apple marketing version is digits-only (0.1.0); prerelease stays in the app/CLI version.
          MARKETING="${VERSION%%-*}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${MARKETING}" \
            apps/sandwalk-mac/Resources/Info.plist 2>/dev/null \
            || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${MARKETING}" \
            apps/sandwalk-mac/Resources/Info.plist 2>/dev/null \
            || true

      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/local-web/src-tauri -> target
          cache-on-failure: true

      - name: Install cmake + uv
        run: |
          brew install cmake
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Import Apple Developer ID
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: bash ./apps/packaging/import-apple-certificate.sh

      - name: Package DMG (Developer ID + notarize)
        env:
          REQUIRE_NOTARIZE: "1"
          CODESIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.ver.outputs.tag }}/Sandwalk.app.tar.gz
        run: ./apps/packaging/package-macos-dmg.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sandwalk-macos-arm64-${{ steps.ver.outputs.version }}
          path: |
            apps/packaging/dist/Sandwalk-*-macos-arm64.dmg
            apps/packaging/dist/Sandwalk-macos-arm64.dmg
            apps/packaging/dist/Sandwalk.app.tar.gz
            apps/packaging/dist/Sandwalk.app.tar.gz.sig
            apps/packaging/dist/latest.json
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Sandwalk Desktop ${{ steps.ver.outputs.tag }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          fail_on_unmatched_files: false
          files: |
            apps/packaging/dist/Sandwalk-${{ steps.ver.outputs.version }}-macos-arm64.dmg
            apps/packaging/dist/Sandwalk-macos-arm64.dmg
            apps/packaging/dist/Sandwalk.app.tar.gz
            apps/packaging/dist/Sandwalk.app.tar.gz.sig
            apps/packaging/dist/latest.json
          body: |
            [Sandwalk](https://sandwalk.sh) is a self-hosted science agent for researchers. Chat, CLI, and the macOS desktop app share the same sessions and workspace.

            **[Download Sandwalk Desktop for macOS (Apple Silicon)](https://github.com/${{ github.repository }}/releases/download/${{ steps.ver.outputs.tag }}/Sandwalk-macos-arm64.dmg)**

            Here's what you can do with Sandwalk Desktop:

            - Run a **local agent server** from the menubar — one install covers the app, API, and `sandwalk` CLI on your PATH.
            - Ask research questions with **plan mode**, multimodal attachments, and human-in-the-loop skill approvals.
            - Use curated tools for **chemistry, targets, structures, omics, clinical, and literature**, plus live databases (PubChem, ChEMBL, UniProt, PDB, …).
            - Connect **Anthropic, OpenAI, Gemini, Grok, local models** (Ollama, Unsloth, oMLX, llama.cpp, LM Studio), skills, and MCPs.
            - Run compute **locally or on Modal / Lambda / Fastfold Cloud**.

            macOS builds are signed with **Developer ID Application** and notarized when Apple secrets are configured. In-app updates use `latest.json` + `Sandwalk.app.tar.gz`.
        env:
          # A classic PAT (repo scope) as RELEASE_GITHUB_TOKEN publishes as you,
          # not github-actions[bot].
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
