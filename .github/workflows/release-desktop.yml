# Build + publish Sandwalk desktop installers.
# macOS arm64 DMG + updater artifacts, and Ubuntu .deb packages (amd64 and arm64).
#
# Apple Developer ID + notarization when APPLE_CERTIFICATE is set
# (see apps/packaging/APPLE-SIGNING.md). Falls back to ad-hoc codesign.
# Updater minisign uses TAURI_SIGNING_PRIVATE_KEY.

name: Release Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without leading v (e.g. 0.1.0-beta.1). Leave blank to use apps/local-web/package.json.'
        type: string
        required: false
      name:
        description: 'Release name after the version, e.g. "Need for Speed" → "v0.1.4: Need for Speed". A song, film, or game that fits what shipped.'
        type: string
        required: false
      draft:
        description: 'Create a draft GitHub Release (recommended until public).'
        type: boolean
        default: true
      prerelease:
        description: 'Mark the GitHub Release as a pre-release.'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.repository }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    name: macOS arm64 DMG
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          INPUT="${{ inputs.version }}"
          if [[ -n "${INPUT// }" ]]; then
            VERSION="${INPUT#v}"
          else
            VERSION="$(node -p 'require("./apps/local-web/package.json").version')"
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: ${VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          NAME="${{ inputs.name }}"
          NAME="${NAME#"${NAME%%[![:space:]]*}"}"; NAME="${NAME%"${NAME##*[![:space:]]}"}"
          if [[ -n "${NAME}" ]]; then
            echo "title=v${VERSION}: ${NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "title=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved version ${VERSION} (tag v${VERSION})"

      - name: Stamp versions
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            for (const p of [
              "apps/local-web/package.json",
              "apps/local-web/src-tauri/tauri.conf.json",
            ]) {
              const j = JSON.parse(fs.readFileSync(p, "utf8"));
              j.version = v;
              fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
            }
            const cargo = "apps/local-web/src-tauri/Cargo.toml";
            let t = fs.readFileSync(cargo, "utf8");
            t = t.replace(/^version = "[^"]+"/m, `version = "${v}"`);
            fs.writeFileSync(cargo, t);
          '
          # Apple marketing version is digits-only (0.1.0); prerelease stays in the app/CLI version.
          MARKETING="${VERSION%%-*}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${MARKETING}" \
            apps/sandwalk-mac/Resources/Info.plist 2>/dev/null \
            || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${MARKETING}" \
            apps/sandwalk-mac/Resources/Info.plist 2>/dev/null \
            || true
          node -e '
            const fs = require("fs");
            fs.writeFileSync(
              "apps/local-web/public/release.json",
              JSON.stringify({
                version: process.env.VERSION,
                pub_date: new Date().toISOString().replace(/\.\d{3}Z$/, "Z")
              }, null, 2) + "\n"
            );
          '

      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/local-web/src-tauri -> target
          cache-on-failure: true

      - name: Install cmake + uv
        run: |
          brew install cmake
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Import Apple Developer ID
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: bash ./apps/packaging/import-apple-certificate.sh

      - name: Package DMG (Developer ID + notarize when secrets are set)
        env:
          CODESIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.ver.outputs.tag }}/Sandwalk.app.tar.gz
        run: ./apps/packaging/package-macos-dmg.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sandwalk-macos-arm64-${{ steps.ver.outputs.version }}
          path: |
            apps/packaging/dist/Sandwalk-*-macos-arm64.dmg
            apps/packaging/dist/Sandwalk-macos-arm64.dmg
            apps/packaging/dist/Sandwalk.app.tar.gz
            apps/packaging/dist/Sandwalk.app.tar.gz.sig
            apps/packaging/dist/latest.json
          if-no-files-found: error

  linux-deb:
    name: Ubuntu ${{ matrix.arch }} deb
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          INPUT="${{ inputs.version }}"
          if [[ -n "${INPUT// }" ]]; then
            VERSION="${INPUT#v}"
          else
            VERSION="$(node -p 'require("./apps/local-web/package.json").version')"
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: ${VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Stamp versions
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            for (const p of [
              "apps/local-web/package.json",
              "apps/local-web/src-tauri/tauri.conf.json",
            ]) {
              const j = JSON.parse(fs.readFileSync(p, "utf8"));
              j.version = v;
              fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
            }
            const cargo = "apps/local-web/src-tauri/Cargo.toml";
            let t = fs.readFileSync(cargo, "utf8");
            t = t.replace(/^version = "[^"]+"/m, `version = "${v}"`);
            fs.writeFileSync(cargo, t);
          '

      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/local-web/src-tauri -> target
          cache-on-failure: true

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            curl \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libclang-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config

      - name: Bundle agent CLI
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="${HOME}/.local/bin:${PATH}"
          case "$(uname -m)" in
            aarch64|arm64) export OPENBLAS_CORETYPE=ARMV8 ;;
          esac
          ./apps/packaging/bundle-agent-runtime.sh apps/packaging/dist/agent-runtime

      - name: Build deb
        working-directory: apps/local-web
        env:
          # whisper-rs probes the host CPU. Some ARM hosts advertise SME
          # without SVE2 and the build then fails. Ship a portable binary.
          GGML_NATIVE: "OFF"
        run: pnpm exec tauri build --bundles deb

      - name: Install CLI into deb
        run: |
          set -euo pipefail
          deb="$(echo apps/local-web/src-tauri/target/release/bundle/deb/*.deb)"
          ./apps/packaging/linux/install-cli-into-deb.sh apps/packaging/dist/agent-runtime "${deb}"

      - name: Check the package contains the user service and CLI
        run: |
          set -euo pipefail
          deb="$(echo apps/local-web/src-tauri/target/release/bundle/deb/*.deb)"
          test -f "$deb"
          # grep -q exits at the first hit and closes the pipe. dpkg-deb then
          # reports "tar: stdout: write error", and pipefail fails the job
          # even though the files are in the package.
          listing="$(mktemp)"
          dpkg-deb -c "$deb" > "$listing"
          grep -q 'usr/lib/systemd/user/sandwalk.service' "$listing"
          grep -q 'usr/lib/sandwalk/sandwalk-serve' "$listing"
          grep -q 'usr/bin/sandwalk' "$listing"
          grep -q 'usr/lib/sandwalk/agent-runtime/bin/' "$listing"

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: sandwalk-deb-${{ matrix.arch }}-${{ steps.ver.outputs.version }}
          path: apps/local-web/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [macos-arm64, linux-deb]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          INPUT="${{ inputs.version }}"
          if [[ -n "${INPUT// }" ]]; then
            VERSION="${INPUT#v}"
          else
            VERSION="$(node -p 'require("./apps/local-web/package.json").version')"
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: ${VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          NAME="${{ inputs.name }}"
          NAME="${NAME#"${NAME%%[![:space:]]*}"}"; NAME="${NAME%"${NAME##*[![:space:]]}"}"
          if [[ -n "${NAME}" ]]; then
            echo "title=v${VERSION}: ${NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "title=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Write release notes
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          TITLE: ${{ steps.ver.outputs.title }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PREV="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          {
            echo "# ${TITLE}"
            echo
            echo "One paragraph: what this release lets a person do."
            echo
            echo "Download:"
            echo
            echo "- [macOS (Apple Silicon)](https://github.com/${REPO}/releases/download/${TAG}/Sandwalk-macos-arm64.dmg)"
            echo "- [Ubuntu amd64](https://github.com/${REPO}/releases/download/${TAG}/Sandwalk_${VERSION}_amd64.deb)"
            echo "- [Ubuntu arm64](https://github.com/${REPO}/releases/download/${TAG}/Sandwalk_${VERSION}_arm64.deb)"
            echo
            echo "## Headline feature"
            echo
            echo "A paragraph in plain words, ending with the PR. #NN"
            echo
            echo "<!-- screenshot -->"
            echo "<br><br><br><br><br>"
            echo
            echo "## New Features and Improvements"
            echo
            if [[ -n "${PREV}" ]]; then
              git log --no-merges --pretty=format:'- %s' "${PREV}..HEAD" | grep -E '^- (feat|perf|ci)' || true
            fi
            echo
            echo
            echo "## Bug Fixes"
            echo
            if [[ -n "${PREV}" ]]; then
              git log --no-merges --pretty=format:'- %s' "${PREV}..HEAD" | grep -E '^- fix' || true
            fi
            echo
            echo
            echo "## Updating"
            echo
            echo "- Mac app: **Check for Updates** in the app menu, or wait for the banner."
            echo "- Ubuntu: install the .deb above, or use APT:"
            echo
            echo '```bash'
            echo 'curl -fsSL https://apt.sandwalk.sh/sandwalk.gpg | sudo gpg --dearmor -o /usr/share/keyrings/sandwalk.gpg'
            echo 'echo "deb [arch=amd64,arm64 signed-by=/usr/share/keyrings/sandwalk.gpg] https://apt.sandwalk.sh stable main" | sudo tee /etc/apt/sources.list.d/sandwalk.list'
            echo 'sudo apt update && sudo apt install sandwalk'
            echo '```'
            echo
            echo "- CLI: \`sandwalk upgrade\`."
            echo
            if [[ -n "${PREV}" ]]; then
              echo "**Full Changelog**: [${PREV}...${TAG}](https://github.com/${REPO}/compare/${PREV}...${TAG})"
            fi
          } > release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.title }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          fail_on_unmatched_files: false
          body_path: release-notes.md
          # The action's default token is the Actions bot. This PAT publishes as you.
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          files: release-assets/*

  publish-apt:
    name: Publish APT repository
    needs: linux-deb
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Download debs
        uses: actions/download-artifact@v4
        with:
          pattern: sandwalk-deb-*
          path: debs
          merge-multiple: true

      - name: Install reprepro
        run: sudo apt-get update && sudo apt-get install -y reprepro

      - name: Publish to apt.sandwalk.sh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SANDWALK_APT_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SANDWALK_APT_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          SANDWALK_APT_S3_BUCKET: sandwalk-apt
          SANDWALK_APT_GPG_PRIVATE_KEY: ${{ secrets.SANDWALK_APT_GPG_PRIVATE_KEY }}
          SANDWALK_APT_GPG_PASSPHRASE: ${{ secrets.SANDWALK_APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(debs/*.deb)
          if [[ ${#debs[@]} -eq 0 ]]; then
            echo "No .deb artifacts found" >&2
            exit 1
          fi
          ./apps/packaging/linux/publish-apt-repo.sh "${debs[@]}"
