name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Agent CLI + Agent Server (Python / pytest-cov → Codecov) ───────────────
  agent-cli:
    name: Agent CLI & Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cli/pyproject.toml

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,all]"

      - name: Ruff lint
        run: ruff check src

      - name: Mypy (scoped strict packages)
        run: mypy

      - name: Syntax and import health
        run: |
          python -m compileall -q src
          python -c "import agent, agent_server, api, cli, data, kb, models, reports, skills, tools, ui; from _version import __version__; print(__version__)"

      - name: CLI health checks
        run: |
          sandwalk --version
          sandwalk skills list
          sandwalk tool list | head -20
          python -c "from agent.config import Config; Config.load()"

      - name: Run CI pytest suite (unit + offline functional)
        run: |
          # Opt-in lanes (network / live chat / Modal / data smoke / pexpect)
          # are auto-deselected in tests/conftest.py unless their env gate is set.
          # Scoped omit list in pyproject.toml (REPL/CLI entry + agent_server glue)
          # mirrors local-web / Mac unit-testable coverage gates.
          pytest tests/ -q \
            --cov=agent --cov=agent_server --cov=api --cov=cli --cov=data --cov=kb --cov=models \
            --cov=reports --cov=skills --cov=tools --cov=ui \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage-full.xml \
            # Measured ~77–85% after omitting interactive TUI packages; keep a
            # small buffer so new helpers don't flake the gate.
            --cov-fail-under=75

      - name: Agent server scoped coverage gate
        run: |
          coverage report \
            --include='*/agent_server/*' \
            --omit='*/agent_server/pty_manager.py,*/agent_server/app.py,*/agent_server/main.py,*/agent_server/mcp_service.py,*/agent_server/service.py,*/agent_server/default_specialists.py' \
            --skip-covered \
            --fail-under=80

      - name: Split coverage XML for Codecov flags
        run: |
          # One flag per upload (Codecov monorepo best practice).
          coverage xml -o coverage-agent-cli.xml --omit='*/agent_server/*'
          coverage xml -o coverage-agent-server.xml \
            --include='*/agent_server/*' \
            --omit='*/agent_server/pty_manager.py,*/agent_server/app.py,*/agent_server/main.py,*/agent_server/mcp_service.py,*/agent_server/service.py,*/agent_server/default_specialists.py'
          ls -la coverage-*.xml

      - name: Upload Agent CLI coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always() && hashFiles('cli/coverage-agent-cli.xml') != ''
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: cli/coverage-agent-cli.xml
          flags: agent-cli
          name: agent-cli
          fail_ci_if_error: false

      - name: Upload Agent Server coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always() && hashFiles('cli/coverage-agent-server.xml') != ''
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: cli/coverage-agent-server.xml
          flags: agent-server
          name: agent-server
          fail_ci_if_error: false

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('cli/coverage-*.xml') != ''
        with:
          name: coverage-agent-cli-server
          path: |
            cli/coverage-agent-cli.xml
            cli/coverage-agent-server.xml
            cli/coverage-full.xml
          retention-days: 14
          if-no-files-found: ignore

      - name: Verify wheel builds and installs
        run: |
          pip install build
          python -m build --outdir dist/
          pip install dist/*.whl
          sandwalk --version

  # ── Local Web UI (Vitest → lcov → Codecov) ────────────────────────────────
  local-web:
    name: Local Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @sandwalk/agent-local-web lint:check

      - name: Typecheck
        run: pnpm --filter @sandwalk/agent-local-web typecheck

      - name: Production build
        run: pnpm --filter @sandwalk/agent-local-web build

      - name: Unit tests + coverage
        run: pnpm --filter @sandwalk/agent-local-web test:coverage

      - name: Upload Local Web coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always() && hashFiles('apps/local-web/coverage/lcov.info') != ''
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/local-web/coverage/lcov.info
          flags: local-web
          name: local-web
          fail_ci_if_error: false

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('apps/local-web/coverage/**') != ''
        with:
          name: coverage-local-web
          path: apps/local-web/coverage/
          retention-days: 14
          if-no-files-found: ignore

  # ── Mac App (XCTest + llvm-cov → lcov → Codecov) ──────────────────────────
  mac-app:
    name: Mac App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Unit tests + coverage gate
        working-directory: apps/sandwalk-mac
        run: ./scripts/test.sh

      - name: Upload Mac App coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/sandwalk-mac/coverage.lcov
          flags: mac-app
          name: mac-app
          fail_ci_if_error: false

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-mac-app
          path: |
            apps/sandwalk-mac/coverage.lcov
            apps/sandwalk-mac/coverage-report.txt
          retention-days: 14

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [agent-cli]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        working-directory: cli
        run: docker compose build

      - name: Smoke test CLI in container
        working-directory: cli
        run: |
          docker compose run --rm -T sandwalk --version
          docker compose run --rm -T sandwalk skills list
          docker compose run --rm -T sandwalk tool list | head -20
