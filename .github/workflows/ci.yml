name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.8.22"

jobs:
  # ── Lint / types / smoke / wheel (parallel with pytest shards) ─────────────
  agent-cli-static:
    name: Agent CLI static
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + test deps
        run: uv sync --extra all --extra dev

      - name: Ruff lint
        run: uv run ruff check src

      - name: Mypy (scoped strict packages)
        run: uv run mypy

      - name: Syntax and import health
        run: |
          uv run python -m compileall -q src
          uv run python -c "import agent, agent_server, api, cli, data, kb, models, reports, skills, tools, ui; from _version import __version__; print(__version__)"

      - name: CLI health checks
        run: |
          uv run sandwalk --version
          uv run sandwalk skills list
          uv run sandwalk tool list | head -20
          uv run python -c "from agent.config import Config; Config.load()"

      - name: Verify wheel builds and installs
        run: |
          uv build --out-dir dist/
          uv pip install --reinstall dist/*.whl
          uv run sandwalk --version

  # ── Pytest: 4 matrix shards × xdist (8 oversubscribed free GHA runners) ───
  agent-cli-tests:
    name: Agent CLI tests (${{ matrix.group }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + test deps
        run: uv sync --extra all --extra dev

      - name: Run CI pytest suite (shard ${{ matrix.group }}/4)
        run: |
          # Opt-in lanes (network / live chat / Modal / data smoke / pexpect)
          # are auto-deselected in tests/conftest.py unless their env gate is set.
          # Coverage gates run in agent-cli-coverage after shards combine.
          # .test_durations keeps least_duration splits balanced across groups.
          uv run pytest tests/ -q \
            --splits 4 --group ${{ matrix.group }} \
            --splitting-algorithm least_duration \
            --durations-path=.test_durations \
            -n auto \
            --dist worksteal \
            --cov=agent --cov=agent_server --cov=api --cov=cli --cov=data --cov=kb --cov=models \
            --cov=reports --cov=skills --cov=tools --cov=ui \
            --cov-report=term-missing:skip-covered
          # pytest-cov+xdist usually leaves a combined .coverage; only combine
          # leftover parallel fragments when needed.
          if [ ! -f .coverage ]; then
            uv run coverage combine
          fi
          test -f .coverage
          mkdir -p ci-coverage
          cp -f .coverage "ci-coverage/shard-${{ matrix.group }}.coverage"
          ls -la ci-coverage/

      - name: Upload shard coverage data
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: coverage-data-${{ matrix.group }}
          path: cli/ci-coverage/
          retention-days: 7
          if-no-files-found: error

  # ── Combine coverage + gates + Codecov (lightweight: coverage pkg only) ───
  agent-cli-coverage:
    name: Agent CLI coverage
    runs-on: ubuntu-latest
    needs: [agent-cli-tests]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install coverage tooling
        run: |
          python -m pip install --upgrade pip
          pip install "coverage>=7.0"

      - name: Download shard coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          path: cli/coverage-shards
          merge-multiple: true

      - name: Combine coverage and enforce gates
        run: |
          # Scoped omit list in pyproject.toml (REPL/CLI entry + agent_server glue)
          # mirrors local-web / Mac unit-testable coverage gates.
          # Coverage gate at 75%: interactive TUI packages are omitted; buffer
          # avoids flakes when new lightly-tested helpers land.
          ls -laR coverage-shards/
          # download-artifact may nest per-artifact dirs; combine all data files.
          mapfile -t files < <(find coverage-shards -type f -name '*.coverage' -print)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Error: no shard coverage data files downloaded." >&2
            exit 1
          fi
          coverage combine "${files[@]}"
          coverage report --fail-under=75
          coverage xml -o coverage-full.xml
          # Matches measured agent_server coverage after package splits / omits.
          coverage report \
            --include='*/agent_server/*' \
            --omit='*/agent_server/pty_manager.py,*/agent_server/app.py,*/agent_server/main.py,*/agent_server/mcp_service.py,*/agent_server/service.py,*/agent_server/default_specialists.py,*/agent_server/pty_manager/*,*/agent_server/mcp_service/*' \
            --skip-covered \
            --fail-under=70
          # One flag per upload (Codecov monorepo best practice).
          # Write under ci-coverage/ — coverage-*.xml is gitignored and hashFiles
          # can miss those paths.
          mkdir -p ci-coverage
          coverage xml -o ci-coverage/coverage-agent-cli.xml --omit='*/agent_server/*'
          coverage xml -o ci-coverage/coverage-agent-server.xml \
            --include='*/agent_server/*' \
            --omit='*/agent_server/pty_manager.py,*/agent_server/app.py,*/agent_server/main.py,*/agent_server/mcp_service.py,*/agent_server/service.py,*/agent_server/default_specialists.py'
          cp -f coverage-full.xml ci-coverage/
          ls -la ci-coverage/

      - name: Upload Agent CLI coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: cli/ci-coverage/coverage-agent-cli.xml
          flags: agent-cli
          name: agent-cli
          fail_ci_if_error: false

      - name: Upload Agent Server coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: cli/ci-coverage/coverage-agent-server.xml
          flags: agent-server
          name: agent-server
          fail_ci_if_error: false

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-agent-cli-server
          path: |
            cli/ci-coverage/coverage-agent-cli.xml
            cli/ci-coverage/coverage-agent-server.xml
            cli/ci-coverage/coverage-full.xml
          retention-days: 14
          if-no-files-found: ignore

  # Single required-check stand-in for the former monolithic Agent CLI job.
  agent-cli:
    name: Agent CLI & Server
    runs-on: ubuntu-latest
    needs: [agent-cli-static, agent-cli-coverage]
    steps:
      - name: Agent CLI gate
        run: echo "static + sharded tests + coverage gates passed"

  # ── Local Web UI (Vitest → lcov → Codecov) ────────────────────────────────
  local-web:
    name: Local Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @sandwalk/agent-local-web lint:check

      - name: Typecheck
        run: pnpm --filter @sandwalk/agent-local-web typecheck

      - name: Production build
        run: pnpm --filter @sandwalk/agent-local-web build

      - name: Unit tests + coverage
        run: pnpm --filter @sandwalk/agent-local-web test:coverage

      - name: Upload Local Web coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always() && hashFiles('apps/local-web/coverage/lcov.info') != ''
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/local-web/coverage/lcov.info
          flags: local-web
          name: local-web
          fail_ci_if_error: false

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('apps/local-web/coverage/**') != ''
        with:
          name: coverage-local-web
          path: apps/local-web/coverage/
          retention-days: 14
          if-no-files-found: ignore

  # ── Mac App (XCTest + llvm-cov → lcov → Codecov) ──────────────────────────
  mac-app:
    name: Mac App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Unit tests + coverage gate
        working-directory: apps/sandwalk-mac
        run: ./scripts/test.sh

      - name: Upload Mac App coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/sandwalk-mac/coverage.lcov
          flags: mac-app
          name: mac-app
          fail_ci_if_error: false

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-mac-app
          path: |
            apps/sandwalk-mac/coverage.lcov
            apps/sandwalk-mac/coverage-report.txt
          retention-days: 14

  # Image smoke only on main (keeps PR wall time on static + pytest shards).
  docker:
    name: Docker image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [agent-cli]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        working-directory: cli
        run: docker compose build

      - name: Smoke test CLI in container
        working-directory: cli
        run: |
          docker compose run --rm -T sandwalk --version
          docker compose run --rm -T sandwalk skills list
          docker compose run --rm -T sandwalk tool list | head -20
