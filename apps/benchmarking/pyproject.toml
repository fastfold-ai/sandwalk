[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sandwalk-bench"
version = "0.1.0"
description = "Sandwalk agent benchmarking — native skill/MCP packs + BixBench adapters"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Fastfold AI Labs", email = "julio@fastfold.ai" }]
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
hf = ["huggingface_hub>=0.26"]
dev = ["pytest>=8.0"]

[project.scripts]
sandwalk-bench = "sandwalk_bench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sandwalk_bench"]

[tool.hatch.build]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
