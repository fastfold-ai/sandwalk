[package]
name = "sandwalk-desktop"
version = "0.0.1"
description = "Sandwalk macOS client (Tauri; Sandwalk Server helper owns the agent)"
authors = ["Fastfold AI Labs"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "sandwalk_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
dirs = "5"
