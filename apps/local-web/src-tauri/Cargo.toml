[package]
name = "sandwalk-desktop"
version = "0.1.0-beta.1"
description = "Sandwalk macOS client (Tauri; Sandwalk Server helper owns the agent)"
authors = ["Fastfold AI Labs"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "sandwalk_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# FAS-107 · Fase 1j · `devtools` de Tauri (Cmd+Option+I dentro de la
# webview) DEBE ir solo en dev builds. En release firmado, expone
# tokens, state, paths y superficie de ataque via APIs Tauri. Se
# activaba con `default = ["devtools"]` por descuido — quedó desde
# el debug del deep link banners.
#
# Uso: `tauri:dev` en `package.json` pasa `--features devtools` para
# activar en dev. `tauri build` (release) NO lo pasa, por lo tanto
# queda desactivado en el DMG firmado.
devtools = ["tauri/devtools"]

[dependencies]
# macos-private-api: transparent window + liquid glass (NSGlassEffectView / vibrancy)
tauri = { version = "2", features = ["macos-private-api", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-liquid-glass = "0.1"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
dirs = "5"
base64 = "0.22"
sandwalk-stt = { path = "../stt" }
sandwalk-tts = { path = "../tts" }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# Replaces the deprecated `cocoa`/`objc` crates for the Dock icon swap below.
# default-features = false + a narrow feature list keeps this from pulling in
# AppKit's full surface (306 features by default) and slowing the build.
objc2 = { version = "0.6", default-features = false, features = ["std"] }
block2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSString", "NSUUID", "block2", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSCell", "NSControl", "NSDockTile", "NSGraphics", "NSImage", "NSImageView", "NSResponder", "NSView", "block2"] }
# FAS-107 · Fase 1g · deep link click en banner nativo macOS.
# El plugin oficial `tauri-plugin-notification` no expone `onAction` en
# desktop (solo mobile), así que registramos un
# `UNUserNotificationCenterDelegate` propio para capturar el click y
# navegar al chat/terminal emisor por su `tag` en `userInfo`.
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotification", "UNNotificationTrigger"] }
