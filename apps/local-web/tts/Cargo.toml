[package]
name = "sandwalk-tts"
version = "0.1.0"
description = "Local, offline Kokoro TTS for Sandwalk desktop (Capy speak-back)"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
ureq = "2.12"
kokoro-en = { version = "0.1.5", default-features = false, features = ["misaki-lean"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "fs", "time"] }
