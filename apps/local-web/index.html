<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Fallback before JS: OS color scheme. applyTheme() overrides for app theme. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon-light.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
      data-sandwalk-favicon="1"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A thinking path for open science — sandwalk dashboard"
    />
    <title>sandwalk</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
