services:
  sandwalk:
    build:
      context: .
      dockerfile: Dockerfile
    # API keys are optional — omit .env entirely, or add keys when you need them.
    env_file:
      - path: .env
        required: false
    volumes:
      - sandwalk-cli:/root/.sandwalk
    stdin_open: true
    tty: true

volumes:
  sandwalk-cli:
