[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sandwalk"
version = "0.1.0-beta.1"
description = "An agent harness for ambitious work."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Fastfold AI Labs", email = "julio@fastfold.ai" }]

dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "anthropic>=0.120.0",
    "openai>=1.0",
    "deepagents>=0.6.12",
    "langchain>=1.3.14",
    "langchain-anthropic>=1.5.2",
    "langchain-openai>=1.4.1",
    "langchain-moonshot>=0.1.0",
    "langgraph>=1.2.9",
    "httpx>=0.27",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    # Local Sandbox (agent.sandbox / run_python) — required, not optional extras.
    "matplotlib>=3.7",
    "pillow>=10.0",
    "seaborn>=0.13",
    "scikit-learn>=1.3",
    "python-dotenv>=1.0",
    "markdown>=3.5",
    "nbformat>=5.7",
    "questionary>=2.1.1",
    "termaid>=0.7.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.8",
    "python-multipart>=0.0.20",
    "langchain-mcp-adapters>=0.3.0",
    # Slack connector (Socket Mode). ~4MB — small enough to always ship so the
    # feature can never half-exist at connect time.
    "slack-bolt>=1.21",
    "mcp>=1.28.1",
    # Modal sandbox backend (Agent → Sandbox). Kept as a default so Mac/app
    # installs work without a separate ``pip install -e '.[modal]'`` step.
    "langchain-modal>=0.0.1",
    "modal>=0.73",
    "langchain-openrouter>=0.2.7",
    "pyyaml>=6.0",
    # Bench suite installs (MMLU / MMLU-Pro / ARC) — one-shot parquet download.
    # Without this, installs fall back to a paged HF API that rate-limits hard.
    "pyarrow>=14.0",
]

[project.optional-dependencies]
http2 = ["hypercorn>=0.17"]
notebook = ["nbconvert>=7.0"]
# Kept for older install commands; packages are now in core dependencies.
slack = ["slack-bolt>=1.21"]
chemistry = ["rdkit>=2023.03"]
biology = ["biopython>=1.81"]
# Parquet reader for Bench dataset installs (MMLU / MMLU-Pro / ARC-C). Without it
# those downloads fall back to a paged HF API that gets rate-limited on the large
# corpora, so keep it in `dev` too — the suite exercises the install path.
bench = ["pyarrow>=14.0"]
singlecell = [
    "scanpy>=1.9",
    "anndata>=0.10",
    "celltypist>=1.6",
    "cellxgene-census>=1.0",
    "tiledbsoma>=1.0",
]
ml = ["torch>=2.0", "transformers>=4.40", "fair-esm>=2.0"]
# Kept for older install commands; packages are now in core dependencies.
analysis = ["seaborn>=0.13", "scikit-learn>=1.3"]
api = ["duckdb>=1.0", "pyarrow>=14.0"]
# Kept for older docs/install commands; packages are now in core dependencies.
modal = ["langchain-modal>=0.0.1", "modal>=0.73"]
# Same extras as ``all`` minus Census/Single Cell (``scanpy``, ``cellxgene-census``, ``tiledbsoma``)—
# omit those on native Windows (no usable ``tiledbsoma`` wheels). Prefer WSL2 + Ubuntu + ``[all]`` instead.
win_build = [
    "rdkit>=2023.03",
    "biopython>=1.81",
    "torch>=2.0",
    "transformers>=4.40",
    "fair-esm>=2.0",
    "seaborn>=0.13",
    "scikit-learn>=1.3",
]
all = [
    "rdkit>=2023.03",
    "biopython>=1.81",
    "scanpy>=1.9",
    "anndata>=0.10",
    "celltypist>=1.6",
    "cellxgene-census>=1.0",
    "tiledbsoma>=1.0",
    "torch>=2.0",
    "transformers>=4.40",
    "fair-esm>=2.0",
    "seaborn>=0.13",
    "scikit-learn>=1.3",
    "duckdb>=1.0",
    "pyarrow>=14.0",
    "openpyxl>=3.1",
    "statsmodels>=0.14",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "pytest-split>=0.9",
    "ruff>=0.8.5",
    "mypy>=1.14.1",
    "types-requests>=2.32.0",
    # Needed by unit tests that exercise parquet / Excel / ORA helpers.
    "pyarrow>=14.0",
    "openpyxl>=3.1",
    "statsmodels>=0.14",
]

# Prefer [project.optional-dependencies].dev for pip/CI; keep uv group in sync.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "pytest-split>=0.9",
    "ruff>=0.8.5",
    "mypy>=1.14.1",
    "types-requests>=2.32.0",
]

[project.scripts]
sandwalk = "cli:entry"
# Compat alias during transition from fastfold-agent-cli installs.
fastfold = "cli:entry"

# Note: skills are portable and self-contained. Their scripts are invoked
# directly (`python scripts/<name>.py ...`) from the skill directory, so they
# are no longer exposed as `skills.*` console entry points here.

[tool.hatch.build.targets.wheel]
packages = ["src/agent", "src/agent_server", "src/api", "src/cli", "src/data", "src/kb", "src/models", "src/reports", "src/skills", "src/tools", "src/ui"]

[tool.hatch.build.targets.wheel.force-include]
"src/_version.py" = "_version.py"
# pymol_mcp/vendor ships inside the agent package path — do not force-include
# it again or hatchling duplicates paths in the wheel.
# hatchling includes all files under the package path, so skills/ data files
# (SKILL.md, scripts/, references/) are bundled automatically

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "venv", "src/agent/mcps/pymol_mcp/vendor"]

[tool.ruff.lint]
# Correctness + imports + bugbear; E501 ignored — formatter owns wrapping.
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",  # line length — formatter/editor handles wrapping
    "B008",  # function calls in argument defaults (Typer/FastAPI patterns)
    "W191",  # indentation contains tabs
    "B904",  # raise without from
    "E402",  # module import not at top (matplotlib Agg, circular imports)
    "E731",  # lambda assignment (CLI prompt factories)
    "E741",  # ambiguous variable names in numeric/scientific code
    "B905",  # zip(..., strict=) — behavior change across large tool surface
    "F401",  # unused imports often probe optional deps (rdkit, nbconvert, …)
    "F841",  # unused locals common in gradual tool cleanup
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.per-file-ignores]
# Large re-export aggregator; keep isort flexible here.
"src/agent_server/models/__init__.py" = ["I001"]

[tool.mypy]
python_version = "3.11"
pretty = true
show_error_codes = true
warn_unused_configs = true
# Same direction as fastfold-cloud-backend (strict). Full-tree strict is gradual —
# start with typed API models, expand packages over time.
strict = true
# models/ re-exports domain types from submodules; allow `from agent_server.models import X`.
implicit_reexport = true
# Scoped gate: packages that currently pass strict mypy. Broader surfaces
# (store/, workspace/, skills/, kb/, models/) are typed gradually.
files = [
  "src/data",
  "src/reports",
  "src/api",
  "src/agent_server/__init__.py",
  "src/agent_server/auth_settings",
  "src/agent_server/default_specialists",
  "src/agent_server/environment_catalog",
  "src/agent_server/environment_service",
  "src/agent_server/pty_manager",
  "src/agent_server/storage_service",
  "src/agent_server/account_service",
  "src/agent_server/datasets_service.py",
  "src/agent_server/status_service",
  "src/agent_server/settings_service",
]
exclude = ["(?x)(tests/|\\.venv/|venv/)"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "rdkit.*",
    "scanpy.*",
    "anndata.*",
    "cellxgene_census.*",
    "tiledbsoma.*",
    "torch.*",
    "transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
    "e2e: end-to-end tests hitting real APIs (use --run-e2e)",
    "docker: tests requiring Docker (use --run-e2e)",
    "e2e_matrix: optional live multi-prompt end-to-end matrix (set RUN_E2E_MATRIX=1)",
    "data_smoke: optional live public data-source smoke tests (set RUN_DATA_SMOKE=1)",
    "integration: interactive terminal tests requiring pexpect and a TTY",
    "cli_functional: real sandwalk subprocess tests with isolated HOME (no live APIs)",
    "cli_network: real sandwalk tests that hit the network (set RUN_CLI_NETWORK=1)",
    "cli_e2e: live one-shot chat / skill+chat tests (set RUN_CLI_E2E=1 + LLM API key)",
    "modal_e2e: live Modal sandbox E2E (set RUN_MODAL_E2E=1 + MODAL_TOKEN_ID/SECRET)",
]

[tool.coverage.run]
relative_files = true
# pytest-xdist workers write parallel data files; pytest-cov / coverage combine merge them.
parallel = true
concurrency = ["multiprocessing", "thread"]
# Statement coverage for the unit-test gate; branch coverage is tracked in reports
# but makes an 80% threshold unrealistic for Typer/CLI-heavy code.
branch = false
omit = [
    # Interactive REPL + modals — covered by focused method tests; full line
    # coverage is impractical (package under ui/terminal/, not just terminal.py).
    "*/ui/terminal.py",
    "*/ui/terminal/*",
    "*/ui/traces/*",
    # Typer CLI entry surface — exercised via CliRunner contract tests.
    "*/cli/*.py",
    "*/cli/setup/*.py",
    # PTY/process supervisor — requires live TTYs; covered by manual/integration use.
    "*/agent_server/pty_manager/*.py",
    # FastAPI/WebSocket route surface and process entrypoint — HTTP contract tests cover behavior.
    "*/agent_server/app.py",
    "*/agent_server/main.py",
    # MCP process/protocol glue — unit-tested at the edges; full coverage needs live servers.
    "*/agent_server/mcp_service/*",
    # Agent session streaming loop — covered by focused workspace/session tests + integration.
    "*/agent_server/service.py",
    # Static specialist catalog payload (data, not behavior).
    "*/agent_server/default_specialists.py",
    # Live Modal create/reuse — needs Modal credentials + network.
    "*/agent/sandbox_backend/lifecycle.py",
    # Optional DESeq2 backends — need pyDESeq2 / R runtime; covered via omics_deseq2 facade tests.
    "*/tools/omics_deseq2_py.py",
    "*/tools/omics_deseq2_r.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.uv]
package = true
# Only ``dev`` is defined under [dependency-groups]; ``full`` was a stale name
# that made ``uv run …`` fail validation.
default-groups = ["dev"]
